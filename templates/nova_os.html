{% extends "base.html" %}
{% block title %}Nova OS - Joanderson Moto Peças{% endblock %}
{% block content %}
<h1>Nova Ordem de Serviço</h1>

<form id="form-os">
    <label>Cliente *</label>

    <div class="cliente-search-container">
        <input
        type="text"
        id="busca-cliente"
        placeholder="🔍 Buscar por nome, placa ou telefone"
        style="width: 100%;" aria-label="Buscar cliente"
        >

        <input
            type="hidden"
            id="cliente_id">

        <div id="lista-clientes-busca"></div>
    </div>

    <label>Descrição geral do serviço
        <textarea id="descricao" rows="2" placeholder="Ex: Troca de óleo e revisão geral"></textarea>
    </label>

    <label>Status
        <select id="status">
            <option value="finalizada">Finalizada (entra no faturamento)</option>
            <option value="pendente">Pendente</option>
            <option value="cancelada">Cancelada</option>
        </select>
    </label>

    <label>Forma de pagamento
        <select id="forma_pagamento">
            <option value="">Selecione...</option>
            <option value="PIX">PIX</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="Cartão de Débito">Cartão de Débito</option>
            <option value="Cartão de Crédito">Cartão de Crédito</option>
        </select>
    </label>

    <h3>Itens / Serviços</h3>
    <table class="tabela" id="tabela-itens">
        <thead>
            <tr>
                <th>Descrição</th>
                <th>Qtd</th>
                <th>Valor Unit. (R$)</th>
                <th>Subtotal</th>
                <th></th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <button type="button" class="btn btn-secondary" onclick="adicionarItem()">+ Adicionar item</button>

    <div class="total-os">
        <strong>Total: <span id="valor-total">R$ 0,00</span></strong>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn">Salvar Ordem de Serviço</button>
    </div>
</form>

<div id="resultado-os" style="display:none;">
    <h3>OS criada com sucesso!</h3>
    <p>OS #<span id="os-id"></span></p>
    <a id="link-pdf" class="btn" target="_blank">📄 Baixar PDF</a>
    <button class="btn btn-secondary" onclick="location.reload()">Criar outra OS</button>
</div>
{% endblock %}

{% block scripts %}
<script>
let itemCount = 0;


function adicionarItem() {
    itemCount++;
    const tbody = document.querySelector('#tabela-itens tbody');
    const tr = document.createElement('tr');
    tr.dataset.id = itemCount;
    tr.innerHTML = `
        <td><input type="text" class="item-descricao" placeholder="Ex: Óleo 10W30" required></td>
        <td><input type="number" class="item-qtd" value="1" min="1" step="1" style="width:70px"></td>
        <td><input type="number" class="item-valor" value="0" min="0.01" step="0.01" style="width:90px"></td>
        <td class="item-subtotal">R$ 0,00</td>
        <td><button type="button" class="btn-sm btn-danger" onclick="removerItem(this)">x</button></td>
    `;
    tbody.appendChild(tr);
    tr.querySelectorAll('.item-qtd, .item-valor').forEach(input => {
        input.addEventListener('input', recalcularTotal);
    });
}

function removerItem(btn) {
    btn.closest('tr').remove();
    recalcularTotal();
}

function recalcularTotal() {
    let total = 0;
    document.querySelectorAll('#tabela-itens tbody tr').forEach(tr => {
        const qtd = parseFloat(tr.querySelector('.item-qtd').value) || 0;
        const valor = parseFloat(tr.querySelector('.item-valor').value) || 0;
        const subtotal = qtd * valor;
        tr.querySelector('.item-subtotal').textContent = formatarMoeda(subtotal);
        total += subtotal;
    });
    document.getElementById('valor-total').textContent = formatarMoeda(total);
}

document.getElementById('form-os').addEventListener('submit', async (e) => {
    e.preventDefault();

    const itens = [];
    document.querySelectorAll('#tabela-itens tbody tr').forEach(tr => {
        const descricao = tr.querySelector('.item-descricao').value;
        const qtd = parseFloat(tr.querySelector('.item-qtd').value) || 1;
        const valor = parseFloat(tr.querySelector('.item-valor').value) || 0;
        if (descricao) {
            itens.push({ descricao, quantidade: qtd, valor_unitario: valor });
        }
    });

    const clienteId =
    document.getElementById("cliente_id").value;

    if (!clienteId) {
        alert("Selecione um cliente na busca.");
        return;
    }

    const dados = {
        cliente_id: parseInt(document.getElementById('cliente_id').value),
        descricao: document.getElementById('descricao').value,
        status: document.getElementById('status').value,
        forma_pagamento: document.getElementById('forma_pagamento').value,
        itens: itens
    };

        if (itens.length === 0) {
        alert("Adicione pelo menos um item.");
        return;
    }

    const r = await fetch('/api/ordens', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
    });

    if (r.ok) {
        const ordem = await r.json();
        document.getElementById('form-os').style.display = 'none';
        document.getElementById('resultado-os').style.display = 'block';
        document.getElementById('os-id').textContent = ordem.id;
        document.getElementById('link-pdf').href = `/api/ordens/${ordem.id}/pdf`;
    } else {
        alert('Erro ao criar a ordem de serviço.');
    }
});

adicionarItem();
</script>
{% endblock %}
