{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>🔐 Login</h1>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label>
                Usuário
                <input
                    type="text"
                    name="usuario"
                    required>
            </label>

            <label>
                Senha
                <input
                    type="password"
                    name="senha"
                    required>
            </label>

            <button
                type="submit"
                class="btn">
                Entrar
            </button>

        </form>

    </div>

</div>

{% endblock %}
